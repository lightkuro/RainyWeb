<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <meta name="description" content="A realistic rain-on-the-window simulation with rain sounds and calming music.">
  <title>Rainy Window</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="view" aria-label="Rain running down a window pane"></canvas>

  <!-- Wooden window frame -->
  <div id="frame" class="frame" data-wood="walnut" aria-hidden="true">
    <div class="frame__glass"></div>
    <div class="frame__top"></div>
    <div class="frame__left"></div>
    <div class="frame__right"></div>
    <div class="frame__sill"></div>
  </div>

  <!-- Home link -->
  <a class="brand" href="https://kurolight.dev">kurolight</a>

  <!-- Scene switcher, centred in the sill -->
  <div id="scene-bar" class="scene-bar"></div>

  <!-- Controls set into the window sill -->
  <nav id="knobs" class="knobs" aria-label="Controls">
    <div class="knob-wrap" id="wrap-rain">
      <button id="knob-rain" class="knob" type="button" aria-label="Rain and view" aria-expanded="false" aria-controls="pop-rain">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15h9.5a3.5 3.5 0 0 0 .4-6.98A5 5 0 0 0 7.3 9.1 3 3 0 0 0 7 15z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.6 18l-.9 2.2M12.4 18l-.9 2.2M16.2 18l-.9 2.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <div id="pop-rain" class="pop" role="group" aria-label="Rain and view"></div>
    </div>
    <div class="knob-wrap" id="wrap-sound">
      <button id="knob-sound" class="knob" type="button" aria-label="Sound (click to mute)" title="Mute" aria-expanded="false" aria-controls="pop-sound">
        <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6L12 18.6V5.4L7.6 9.5H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6L12 18.6V5.4L7.6 9.5H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <div id="pop-sound" class="pop" role="group" aria-label="Sound"></div>
    </div>
    <div class="knob-wrap">
      <button id="knob-settings" class="knob" type="button" aria-label="Settings" aria-expanded="false" aria-controls="panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </nav>

  <!-- Title: fades away by itself -->
  <div id="intro" class="intro" aria-hidden="true">
    <h1>Rainy Window</h1>
    <p>Sit back. It's raining outside.</p>
    <div class="intro__hint">
      interactable
      <svg viewBox="0 0 48 24" aria-hidden="true"><path d="M3 16C12 4.5 26 4.5 34 13.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/><circle cx="39" cy="16" r="3" fill="currentColor"/><circle cx="39" cy="16" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45"/></svg>
    </div>
  </div>

  <!-- Settings panel -->
  <aside id="panel" class="panel" aria-label="Settings" aria-hidden="true">
    <header class="panel__head">
      <h2>Settings</h2>
      <button id="btn-close" class="close" type="button" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </header>
    <div id="panel-body" class="panel__body"></div>
    <footer class="panel__foot">
      <button id="btn-back" class="back" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
    </footer>
  </aside>

  <div id="fallback" class="fallback" hidden>
    <p>Your browser doesn't support WebGL, which this rain simulation needs.</p>
  </div>

  <script src="js/background-data.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
